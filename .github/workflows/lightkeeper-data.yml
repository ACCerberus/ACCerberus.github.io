name: LightKeeper data

# Refreshes lightkeeper/data/*.json once a week (and on demand): the USCG NAVCEN Light List and NOAA station
# lists (tools/build_aids.py, a minute) and the OpenStreetMap places crawl (tools/build_pois.py, slow: one
# Overpass request at a time). Commits the result when anything changed. The web app and the desktop app's
# warm cache read these static files.

on:
  schedule:
    - cron: "15 9 * * 1"   # Mondays 09:15 UTC
  workflow_dispatch:
    inputs:
      districts:
        description: "District ids to crawl for places, comma-separated (blank = no places crawl). Example: 13"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: lightkeeper-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Light List data
        run: python tools/build_aids.py

      # Places crawl is paused: the public Overpass servers time out from GitHub's runners. It runs only when
      # started by hand with district ids; the weekly run refreshes the Light List only.
      - name: Crawl OpenStreetMap places (keeps previous files for districts that fail)
        if: github.event_name == 'workflow_dispatch' && inputs.districts != ''
        continue-on-error: true
        env:
          DISTRICTS: ${{ inputs.districts }}
        run: python tools/build_pois.py --districts "$DISTRICTS"

      - name: Commit changes
        run: |
          git add lightkeeper/data
          if git diff --cached --quiet; then
            echo "No Light List changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[data] Light List and places update"
          # Someone may have pushed while the crawl ran: rebase onto it and retry instead of failing the run.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          exit 1
