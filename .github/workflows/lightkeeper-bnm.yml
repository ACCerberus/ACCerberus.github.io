name: LightKeeper BNM

# Hourly: USCG Broadcast Notices to Mariners for aids to navigation (Northwest district for now) into
# lightkeeper/data/bnm-D13.json, which the web app's Discrepancies > BNMs view reads. Commits only when notices change.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lightkeeper-bnm
  cancel-in-progress: false

jobs:
  bnm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch broadcast notices
        run: python tools/build_bnm.py
      - name: Commit changes
        run: |
          git add lightkeeper/data/bnm-*.json
          if git diff --cached --quiet; then
            echo "No new notices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[data] Broadcast notices update"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying in 15 s"
            sleep 15
          done
          exit 1
