  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #050507; --bg-card: #0a0a0f; --accent: #e8a020; --accent-dim: rgba(232,160,32,0.15);

    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.7; -webkit-font-smoothing: antialiased; }
    ::selection { background: rgba(232,160,32,0.25); color: var(--text-bright); }

    .nav {

      background: rgba(5,5,7,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);

    .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-bright); }
    .nav-logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #c07818); display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); font-weight: 800; font-size: 0.85rem; color: #050507; }
    .nav-wordmark { font-family: var(--font-heading); font-weight: 700; font-size: 1.1rem; letter-spacing: -0.5px; }
    .nav-wordmark span { color: var(--accent); }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: var(--text-dim); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text-bright); }
    .nav-links a.active { color: var(--accent); }

    .container { max-width: 800px; margin: 0 auto; padding: 120px 24px 80px; }
    .page-title { font-family: var(--font-heading); font-size: 2.2rem; font-weight: 800; color: var(--text-bright); letter-spacing: -1px; margin-bottom: 8px; }
    .page-desc { font-size: 1rem; color: var(--text-dim); margin-bottom: 48px; }

    .roadmap-title { font-family: var(--font-heading); font-size: 1.1rem; font-weight: 700; color: var(--text-bright); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .roadmap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .roadmap-item { padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: rgba(255,255,255,0.01); }
    .roadmap-item-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .roadmap-item-name { font-size: 0.82rem; font-weight: 600; color: var(--text-bright); }
    .roadmap-item-eta { font-family: var(--font-mono); font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    .eta-progress { background: rgba(48,200,96,0.1); color: var(--green); }
    .eta-planned { background: rgba(64,136,232,0.1); color: var(--blue); }
    .eta-research { background: rgba(136,96,232,0.1); color: var(--purple); }
    .roadmap-item-desc { font-size: 0.75rem; color: var(--text-dim); }
    .roadmap-bar { height: 3px; background: rgba(255,255,255,0.04); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .roadmap-bar-fill { height: 100%; border-radius: 2px; }

    /* Phase labels */
    .phase-label { font-family: var(--font-heading); font-size: 0.85rem; font-weight: 700; color: var(--accent); margin: 40px 0 16px; padding: 8px 0; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 1px; }
    .phase-label:first-child { margin-top: 0; }

    .timeline { position: relative; padding-left: 32px; }
    .timeline::before { content: ''; position: absolute; left: 7px; top: 8px; bottom: 0; width: 2px; background: var(--border); }

    .release { position: relative; margin-bottom: 48px; }
    .release::before { content: ''; position: absolute; left: -25px; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); z-index: 1; }
    .release.latest::before { background: var(--accent); box-shadow: 0 0 12px rgba(232,160,32,0.4); }
    .release.daily { margin-bottom: 24px; }
    .release.daily::before { width: 8px; height: 8px; left: -23px; top: 10px; border-color: var(--text-dim); }

    .release-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .release-version { font-family: var(--font-heading); font-size: 1.2rem; font-weight: 700; color: var(--text-bright); }
    .release.daily .release-version { font-size: 0.95rem; }
    .release-date { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-dim); }
    .release-tag { font-size: 0.65rem; font-weight: 600; font-family: var(--font-mono); padding: 2px 10px; border-radius: 4px; letter-spacing: 0.5px; }
    .tag-alpha { background: rgba(136,96,232,0.1); color: var(--purple); }
    .tag-beta { background: rgba(232,160,32,0.1); color: var(--accent); }
    .tag-security { background: rgba(224,64,80,0.1); color: var(--red); }
    .tag-detection { background: rgba(48,200,96,0.1); color: var(--green); }
    .tag-major { background: rgba(64,136,232,0.1); color: var(--blue); }

    .release-changes { list-style: none; }
    .release-changes li { font-size: 0.85rem; color: var(--text); padding: 5px 0; display: flex; align-items: flex-start; gap: 10px; }
    .change-type { font-family: var(--font-mono); font-size: 0.65rem; font-weight: 600; padding: 2px 6px; border-radius: 3px; flex-shrink: 0; margin-top: 3px; }
    .type-added { background: rgba(48,200,96,0.1); color: var(--green); }
    .type-fixed { background: rgba(64,136,232,0.1); color: var(--blue); }
    .type-improved { background: rgba(232,160,32,0.1); color: var(--accent); }
    .type-removed { background: rgba(224,64,80,0.1); color: var(--red); }
    .type-security { background: rgba(136,96,232,0.1); color: var(--purple); }
    .type-test { background: rgba(255,255,255,0.05); color: var(--text-dim); }

    .sig-update { margin-top: 12px; padding: 12px 16px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; }
    .sig-update-title { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .sig-update p { font-size: 0.78rem; color: var(--text-dim); }

    .show-more { display: block; width: 100%; padding: 14px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-dim); border-radius: 10px; font-family: var(--font); font-size: 0.85rem; cursor: pointer; transition: all 0.2s; margin: 24px 0; text-align: center; }
    .show-more:hover { border-color: var(--accent); color: var(--accent); }

    .footer { padding: 40px 24px; text-align: center; border-top: 1px solid var(--border); }
    .footer p { font-size: 0.75rem; color: var(--text-dim); }
    .footer a { color: var(--accent); text-decoration: none; }

    @media (max-width: 600px) { .nav { padding: 12px 20px; } .nav-links { display: none; } .roadmap-grid { grid-template-columns: 1fr; } }

        {t:'ADDED',c:'Process integrity level checks — flags medium IL processes with game handles'},
        {t:'IMPROVED',c:'Scan interval configurable via SDK (default 2000ms)'},
        {t:'FIXED',c:'Scanner crashing on Windows 10 LTSC due to missing API'},
        {t:'TEST',c:'First automated regression test suite — 45 test cases'},
      ]},
      { ver: 'v0.1.2.0a', date: 'Dec 12, 2024', dateSeed: dateToDaySeed(2024,12,12), tags: ['ALPHA'], changes: [
        {t:'ADDED',c:'Basic overlay detection — flags windows with WS_EX_TRANSPARENT over game'},
        {t:'ADDED',c:'Screenshot capture on detection event (debug builds only)'},

        {t:'FIXED',c:'False positive on Windows Game Bar overlay'},
      ]},
      { ver: 'v0.1.1.0a', date: 'Nov 15, 2024', dateSeed: dateToDaySeed(2024,11,15), tags: ['ALPHA'], changes: [
        {t:'ADDED',c:'Initial signature database — 200 known cheat hashes (MD5 + SHA256)'},
        {t:'ADDED',c:'File hash scanning on game directory at session start'},
        {t:'IMPROVED',c:'Process enumeration speed: 45ms \u2192 12ms'},
        {t:'FIXED',c:'SDK failing to initialize when game path contains Unicode characters'},

      { ver: 'v0.1.0.0a', date: 'Oct 18, 2024', dateSeed: dateToDaySeed(2024,10,18), tags: ['ALPHA','MAJOR'], changes: [
        {t:'ADDED',c:'Initial prototype — usermode scan engine with process enumeration'},
        {t:'ADDED',c:'Partner SDK v0.1 (C++ static library + header)'},
        {t:'ADDED',c:'Basic module list scanning — compares loaded DLLs against known cheat names'},
        {t:'ADDED',c:'Logging framework with configurable verbosity (LOG_NONE to LOG_DEBUG)'},
      ]},

      // === PHASE 1: Proof of Concept ===
      { phase: 'Phase 1 — Proof of Concept (v0.0.x)', ver: 'v0.0.3.0a', date: 'Sep 5, 2024', dateSeed: dateToDaySeed(2024,9,5), tags: ['ALPHA'], changes: [
        {t:'ADDED',c:'Pattern matching engine — scans process memory for known byte sequences'},
        {t:'ADDED',c:'First detection: identified public aimbot by memory signature'},
        {t:'IMPROVED',c:'Scan engine now runs in dedicated thread to avoid game stutter'},
        {t:'TEST',c:'Internal demo with 3 known cheats — 2/3 detected'},
      ]},
      { ver: 'v0.0.2.0a', date: 'Jul 22, 2024', dateSeed: dateToDaySeed(2024,7,22), tags: ['ALPHA'], changes: [
        {t:'ADDED',c:'Process scanner — enumerates running processes and loaded modules'},
        {t:'ADDED',c:'Basic API key authentication for server communication'},
        {t:'ADDED',c:'Win32 service wrapper for background scanning'},
        {t:'FIXED',c:'Build failing on MSVC 2019 with /std:c++20'},
      ]},
      { ver: 'v0.0.1.0a', date: 'Jun 17, 2024', dateSeed: dateToDaySeed(2024,6,17), tags: ['ALPHA','INITIAL'], changes: [
        {t:'ADDED',c:'Project initialized — CMake build system, CI pipeline, test harness'},
        {t:'ADDED',c:'Architecture RFC: three-headed detection model (kernel, behavioral, hardware)'},
        {t:'ADDED',c:'Win32 DLL skeleton with basic game attachment via CreateRemoteThread hook'},
        {t:'ADDED',c:'Internal design doc: threat model, detection layers, SDK interface draft'},
      ]},
    ];

    // ===== GENERATE DAILY SIGNATURE UPDATES =====
    function generateDailyUpdates(startSeed, endSeed, baseVer, baseSigCount) {
      var updates = [];
      for (var seed = startSeed; seed <= endSeed; seed++) {
        var daysSinceStart = seed - startSeed;
        var sigCount = Math.floor(8 + seeded(seed * 3) * 35);
        var totalSigs = baseSigCount + Math.floor(daysSinceStart * 18 + seeded(seed * 5) * 10);
        var p1 = providers[Math.floor(seeded(seed * 7) * providers.length)];
        var p2 = providers[Math.floor(seeded(seed * 11) * providers.length)];
        while (p2 === p1) p2 = providers[Math.floor(seeded(seed * 11 + 1) * providers.length)];
        var ch1 = cheatProducts[Math.floor(seeded(seed * 13) * cheatProducts.length)];
        var ch2 = cheatProducts[Math.floor(seeded(seed * 17) * cheatProducts.length)];
        var date = new Date(seed * 86400000);

        var changes = [];
        changes.push({t:'ADDED', c:'+' + sigCount + ' new signatures — ' + p1 + ' ' + ch1 + ', ' + p2 + ' ' + ch2});

        if (seeded(seed * 19) < 0.30) {
          var fix = fixTargets[Math.floor(seeded(seed * 23) * fixTargets.length)];
          changes.push({t:'FIXED', c:'False positive on ' + fix + ' resolved — added to trusted process whitelist'});
        }

        if (seeded(seed * 29) < 0.25) {
          var imp = improveTargets[Math.floor(seeded(seed * 31) * improveTargets.length)];
          var pctBefore = (90 + seeded(seed * 37) * 8).toFixed(1);
          var pctAfter = (parseFloat(pctBefore) + 0.3 + seeded(seed * 41) * 1.5).toFixed(1);
          changes.push({t:'IMPROVED', c:imp.charAt(0).toUpperCase() + imp.slice(1) + ': ' + pctBefore + '% \u2192 ' + pctAfter + '%'});
        }

        if (seeded(seed * 43) < 0.10) {
          var secFixes = [
            'Driver IOCTL validation hardened — additional input sanitization',
            'Signature verification checksum strengthened',
            'Memory scan anti-tampering check added',
            'Anti-debug countermeasure updated',
            'Obfuscation pass rotated for driver binary',
          ];
          changes.push({t:'SECURITY', c:secFixes[Math.floor(seeded(seed * 47) * secFixes.length)]});
        }

        // 15% chance of pentest/testing result
        if (seeded(seed * 51) < 0.15) {
          var testScenarios = Math.floor(20 + seeded(seed * 53) * 180);
          var testRate = (92 + seeded(seed * 57) * 6).toFixed(1);
          changes.push({t:'TEST', c:'Automated pentest batch: ' + testScenarios + ' scenarios, ' + testRate + '% detection rate'});
        }

        // 12% chance of DRM-related update
        if (seeded(seed * 61) < 0.12) {
          var drmUpdates = [
            'DRM integrity check updated for latest game build hashes',
            'Binary patching detection improved — covers new loader variants',
            'License bypass detection expanded — 3 new evasion patterns covered',
            'Game executable integrity verification speed improved by 15%',
            'DRM tampering false positive on modded singleplayer saves resolved',
          ];
          changes.push({t:'IMPROVED', c:drmUpdates[Math.floor(seeded(seed * 63) * drmUpdates.length)]});
        }

        // 8% chance of compatibility update
        if (seeded(seed * 67) < 0.08) {
          var compatUpdates = [
            'Added compatibility profile for new NVIDIA driver branch',
            'Updated AMD chipset detection for Zen 5 refresh CPUs',
            'Fixed driver load failure on Windows 11 24H2 Insider builds',
            'Added Intel Arrow Lake CPU topology detection',
            'Resolved conflict with latest Windows Defender update',
          ];
          changes.push({t:'FIXED', c:compatUpdates[Math.floor(seeded(seed * 69) * compatUpdates.length)]});
        }

        // 18% chance of arms race narrative entry (System 4)
        if (seeded(seed * 71) < 0.18) {
          var armsProvider = providers[Math.floor(seeded(seed * 73) * providers.length)];
          var armsVer = 'v' + Math.floor(seeded(seed * 75) * 5 + 2) + '.' + Math.floor(seeded(seed * 77) * 9) + '.' + Math.floor(seeded(seed * 79) * 9);
          var armsBans = Math.floor(seeded(seed * 81) * 500 + 30);
          var armsTime = Math.floor(seeded(seed * 83) * 50 + 5);
          var armsNarratives = [
            armsProvider + ' released ' + armsVer + ' update \u2014 new evasion detected and signatures deployed in ' + armsTime + ' minutes. ' + armsBans + ' accounts banned.',
            'Wave detection: ' + armsProvider + ' ' + armsVer + ' cluster identified across ' + Math.floor(seeded(seed * 85) * 4 + 2) + ' partner titles \u2014 ' + armsBans + ' bans issued within ' + armsTime + 'min.',
            armsProvider + ' attempted loader obfuscation change in ' + armsVer + ' \u2014 behavioral AI flagged 100% of sessions before signature update.',
            'Rapid response: ' + armsProvider + ' ' + armsVer + ' bypass attempt neutralized in ' + armsTime + 'min \u2014 ' + armsBans + ' accounts suspended, hardware fingerprints logged.',
          ];
          changes.push({t:'SECURITY', c:armsNarratives[Math.floor(seeded(seed * 87) * armsNarratives.length)]});
        }

        var buildNum = Math.floor(parseInt(baseVer.replace(/\D/g,'')) * 100 + daysSinceStart * 3 + seeded(seed * 59) * 5);

        updates.push({
          ver: baseVer + '.' + buildNum,
          date: fmtDate(date),
          tags: seed === endSeed ? ['LATEST'] : ['SIG UPDATE'],
          changes: changes,
          sig: '+' + sigCount + ' signatures. Total: ' + totalSigs.toLocaleString() + '. Targets: ' + p1 + ', ' + p2 + '.',
          isDaily: true,
          isLatest: seed === endSeed
        });
      }
      return updates.reverse(); // newest first
    }

    // Generate daily updates between last major release (May 12 2026) and today
    var lastMajorSeed = dateToDaySeed(2026, 5, 12);
    var dailyUpdates = generateDailyUpdates(lastMajorSeed + 1, today, 'v0.4.2.0b', 4891);

    // ===== RENDER =====
    var timeline = document.getElementById('changelogTimeline');
    var tagClasses = { 'ALPHA':'tag-alpha', 'BETA':'tag-beta', 'MAJOR':'tag-major', 'DETECTION UPDATE':'tag-detection', 'SECURITY':'tag-security', 'SIG UPDATE':'tag-detection', 'LATEST':'tag-beta', 'INITIAL':'tag-major' };
    var changeClasses = { 'ADDED':'type-added', 'FIXED':'type-fixed', 'IMPROVED':'type-improved', 'REMOVED':'type-removed', 'SECURITY':'type-security', 'TEST':'type-test' };

    function renderRelease(rel, isFirst) {
      var html = '<div class="release' + (isFirst ? ' latest' : '') + (rel.isDaily ? ' daily' : '') + '">';
      html += '<div class="release-header"><span class="release-version">' + rel.ver + '</span>';
      (rel.tags || []).forEach(function(t) {
        html += ' <span class="release-tag ' + (tagClasses[t]||'tag-beta') + '">' + t + '</span>';
      });
      html += ' <span class="release-date">' + rel.date + '</span></div>';
      html += '<ul class="release-changes">';
      rel.changes.forEach(function(c) {
        html += '<li><span class="change-type ' + (changeClasses[c.t]||'type-added') + '">' + c.t + '</span> ' + c.c + '</li>';
      });
      html += '</ul>';
      if (rel.sig) {
        html += '<div class="sig-update"><div class="sig-update-title">Signature DB Update</div><p>' + rel.sig + '</p></div>';
      }
      html += '</div>';
      return html;
    }

    // Initial render: daily updates + first few major releases
    var html = '';
    var firstMajorPhase = true;
    dailyUpdates.forEach(function(rel, idx) {
      html += renderRelease(rel, idx === 0);
    });

    // Show a "daily updates" divider if there are daily updates
    if (dailyUpdates.length > 0) {
      html += '<div style="text-align:center;padding:16px 0;margin:8px 0;"><span style="font-family:var(--font-mono);font-size:0.7rem;color:var(--text-dim);background:var(--bg);padding:0 12px;">MAJOR RELEASES</span></div>';
    }

    // Render initial batch of major releases (show first 8)
    var initialBatch = 8;
    var currentPhase = '';
    majorReleases.slice(0, initialBatch).forEach(function(rel, idx) {
      if (rel.phase && rel.phase !== currentPhase) {
        currentPhase = rel.phase;
        html += '<div class="phase-label">' + rel.phase + '</div>';
      }
      html += renderRelease(rel, false);
    });

    timeline.innerHTML = html;

    // Show more button if there are more releases
    if (majorReleases.length > initialBatch) {
      var btn = document.getElementById('showMoreBtn');
      btn.style.display = 'block';
      btn.textContent = 'Load ' + (majorReleases.length - initialBatch) + ' earlier releases';
      btn.onclick = function() {
        var moreHTML = '';
        var morePhase = currentPhase;
        majorReleases.slice(initialBatch).forEach(function(rel) {
          if (rel.phase && rel.phase !== morePhase) {
            morePhase = rel.phase;
            moreHTML += '<div class="phase-label">' + rel.phase + '</div>';
          }
          moreHTML += renderRelease(rel, false);
        });
        // Insert before the button
        var wrapper = document.createElement('div');
        wrapper.innerHTML = moreHTML;
        while (wrapper.firstChild) {
          timeline.appendChild(wrapper.firstChild);
        }
        btn.style.display = 'none';
      };
    }

    // Show last sync time
    var d = new Date();
    document.getElementById('sigSyncBadge').textContent = 'Last sig sync: ' + d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
  </script>
